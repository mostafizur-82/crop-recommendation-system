<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crop Recommendation</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>

</head>


<body>

    <div class="container">

        <div class="card">


            <!-- Header -->

            <div class="header">

                <div class="icon">
                    🌱
                </div>

                <h1>
                    Crop Recommendation
                </h1>

                <p>
                    Enter soil and weather information
                </p>

            </div>


            <!-- Form -->

            <form id="cropForm">


                <div class="input-group">

                    <label for="nitrogen">
                        Nitrogen (N)
                    </label>

                    <input
                        type="number"
                        step="any"
                        id="nitrogen"
                        placeholder="Enter Nitrogen value"
                        required
                    >

                </div>



                <div class="input-group">

                    <label for="phosphorus">
                        Phosphorus (P)
                    </label>

                    <input
                        type="number"
                        step="any"
                        id="phosphorus"
                        placeholder="Enter Phosphorus value"
                        required
                    >

                </div>



                <div class="input-group">

                    <label for="potassium">
                        Potassium (K)
                    </label>

                    <input
                        type="number"
                        step="any"
                        id="potassium"
                        placeholder="Enter Potassium value"
                        required
                    >

                </div>



                <div class="input-group">

                    <label for="temperature">
                        Temperature (°C)
                    </label>

                    <input
                        type="number"
                        step="any"
                        id="temperature"
                        placeholder="Enter temperature"
                        required
                    >

                </div>



                <div class="input-group">

                    <label for="humidity">
                        Humidity (%)
                    </label>

                    <input
                        type="number"
                        step="any"
                        id="humidity"
                        placeholder="Enter humidity"
                        required
                    >

                </div>



                <div class="input-group">

                    <label for="ph">
                        Soil pH
                    </label>

                    <input
                        type="number"
                        step="any"
                        id="ph"
                        placeholder="Enter pH value"
                        required
                    >

                </div>



                <div class="input-group">

                    <label for="rainfall">
                        Rainfall (mm)
                    </label>

                    <input
                        type="number"
                        step="any"
                        id="rainfall"
                        placeholder="Enter rainfall"
                        required
                    >

                </div>



                <button type="submit">

                    🌾 Recommend Crop

                </button>


            </form>



            <!-- Magical Loader -->

            <div
                id="magicLoader"
                class="magic-loader"
            >

                <div class="magic-ring"></div>

                <div class="magic-ring ring-two"></div>

                <div class="magic-core">

                    🌱

                </div>

                <p>
                    Analyzing your field...
                </p>

            </div>



            <!-- Result -->

            <div
                class="result"
                id="result"
            >

                <h3>
                    Recommended Crop
                </h3>

                <div
                    class="crop-name"
                    id="cropName"
                >
                    —
                </div>

            </div>


        </div>

    </div>


</body>

</html>
